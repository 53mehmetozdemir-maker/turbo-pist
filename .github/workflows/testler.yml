# Altın testler (Aşama 6). Her test ayrı makinede, paralel koşar; biri kırmızıysa iş akışı kırmızıdır.
# - Canlı yayın (yayin.yml) ve önizleme (turbo-pist-onizleme/onizleme.yml) yayından ÖNCE bunu çağırır:
#   testler kırılırsa yayın durur.
# - Tarayıcı sabit: Chrome for Testing 153.0.8010.12 + SwiftShader; yazı tipleri ve yazı çizimi sistemden bağımsız
#   (tests/fonts/fonts.conf). Referans görüntüler bu düzenle çekildi.
# - Dış ağ kapalı (tests/baseline/lib.mjs): çok oyunculu test kendi yerel PeerJS sunucusuyla koşar, dış servise bağlı değil.
# - perf: süreler makineye göre oynadığı için yalnız uyarı verir (çizim/üçgen sayıları yine raporlanır).
# Secret kullanılmaz.
name: testler

on:
  push:
    branches: [altyapi, 'is/**']
  # pull_request kaldırıldı: is/** dalı push'ta zaten test ediliyor; PR açınca aynı testler ikinci kez koşuyordu.
  workflow_dispatch:
    inputs:
      sadece:
        description: "Sadece bu testler (virgülle, ör. sw,mp). Boş = hepsi"
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        description: "Sınanacak turbo-pist commit'i (boşsa çağıran commit)"
        type: string
        default: ''

permissions:
  contents: read

# Aynı dala yeni commit gelince o dalın eski (artık geçersiz) test turu iptal edilir; makine sırası boşa dolmaz.
# Yayın (yayin.yml) bunu çağırdığında grup çağıranın dalıdır (main); orada da yeni commit eskisini geçersiz kılar.
concurrency:
  group: testler-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}

env:
  # GitHub makinesi yavaş kalabilir: gerçek-zaman beklemeleri 2 kat (sonuçlar donmuş test saatine bağlı, değişmez)
  TP_ZAMAN_KAT: '2'
  CHROME_SURUM: '153.0.8010.12'

jobs:
  hazirlik:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      liste: ${{ steps.liste.outputs.liste }}
    steps:
      - name: Test listesi
        id: liste
        env:
          SADECE: ${{ inputs.sadece }}
        run: |
          set -euo pipefail
          # Uzun testler parçalara bölünür (aynı anda ayrı makinelerde koşar). Parça adı: <test>-<parça>.
          # Parçaların birleşimi tüm testi kapsar; ayrıntı aşağıdaki "Test" adımında.
          # Sıra önemli: GitHub aynı anda en fazla 20 makine verir; en uzun sürenler başta ki sırada beklemesinler.
          hepsi="bellek-1 bellek-2 bellek-3 mp physics menu-1920x1080 ultra
                 visual-takip visual-kokpit visual-sehir visual-yerler visual-servis menu-1904x986
                 saves saglamlik sw keys perf menu-1366x768 menu-1280x720 harita
                 menu-telefon_dikey menu-telefon_yatay klasik worker visual-kalan motor"
          secili=""
          for t in $hepsi; do
            taban="${t%%-*}"
            if [ -z "${SADECE:-}" ] || [[ ",${SADECE// /}," == *",$taban,"* ]] || [[ ",${SADECE// /}," == *",$t,"* ]]; then secili="$secili \"$t\","; fi
          done
          [ -n "$secili" ] || { echo "::error::Seçilen test yok: $SADECE"; exit 1; }
          echo "liste=[${secili%,}]" >> "$GITHUB_OUTPUT"; echo "testler: [${secili%,}]"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 53mehmetozdemir-maker/turbo-pist
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12.0'
      - name: Test dosyalarının sözdizimi
        run: for f in tests/baseline/*.mjs; do node --check "$f"; done
      - run: npm ci --no-audit --no-fund
      - name: Test derlemesi
        run: npx vite build --base=/ --outDir /tmp/derleme
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: derleme
          path: /tmp/derleme
          retention-days: 3

  test:
    needs: hazirlik
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.hazirlik.outputs.liste) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 53mehmetozdemir-maker/turbo-pist
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0          # mp: eski sürüm olarak canlının kodu (e771e2a) git worktree ile açılır
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12.0'
      - name: Bağımlılıklar
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix tests
      - name: Test yazı tipleri (npm'deki sabit sürümler → TTF)
        run: |
          pip install --user --no-deps fonttools==4.60.1 brotli==1.1.0
          sh tests/fonts/hazirla.sh
      - name: Chrome for Testing ${{ env.CHROME_SURUM }}
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/chrome.zip "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_SURUM}/linux64/chrome-linux64.zip"
          sha256sum /tmp/chrome.zip
          unzip -q /tmp/chrome.zip -d /opt
          v=$(/opt/chrome-linux64/chrome --headless=new --no-sandbox --version || true)
          echo "$v"; case "$v" in *"$CHROME_SURUM"*) ;; *) echo "::error::Beklenen Chrome $CHROME_SURUM, bulunan: $v"; exit 1;; esac
          echo "CHROME=/opt/chrome-linux64/chrome" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: derleme
          path: /tmp/derleme
      - name: ${{ matrix.test }}
        working-directory: tests
        env:
          GAME_ROOT: /tmp/derleme
        run: |
          set -o pipefail
          T="${{ matrix.test }}"
          case "$T" in
            perf)
              node baseline/perf.mjs | tee /tmp/perf.txt || echo "::warning title=perf::Performans ölçümü referanstan kötü çıktı (yalnız uyarı; süreler makineye göre oynar). Ayrıntı: bu adımın çıktısı." ;;
            # görsel: 35 görüntü 5 parçaya (7'şer). "kalan": hiçbir parçaya girmeyen (sonradan eklenen) görüntüler; boş olabilir.
            visual-takip)  node baseline/visual.mjs check '_takip$' ;;
            visual-kokpit) node baseline/visual.mjs check '_kokpit$' ;;
            visual-sehir)  node baseline/visual.mjs check '^(menu|kaput_|sehir_|laptop_)' ;;
            visual-yerler) node baseline/visual.mjs check '^(pist_|otoyol|dag_|zirve|drift_)' ;;
            visual-servis) node baseline/visual.mjs check '^(sahil|benzinlik|tamirci|buyuk_|duraklat|telefon)' ;;
            visual-kalan)  TP_BOS_IZIN=1 node baseline/visual.mjs check '^(?!.*_(takip|kokpit)$)(?!(menu|kaput_|sehir_|laptop_|pist_|otoyol|dag_|zirve|drift_|sahil|benzinlik|tamirci|buyuk_|duraklat|telefon))' ;;
            # menü: 6 ekran boyutu ayrı makinelerde
            menu-*) node baseline/menu.mjs check "^${T#menu-}$" ;;
            # bellek: f458 + iki/üç araç arasında döner; üç parçanın birleşimi 7 aracı kapsar
            bellek-1) BELLEK_ARACLAR=f40,model3 node baseline/bellek.mjs ;;
            bellek-2) BELLEK_ARACLAR=e2008,gsxr node baseline/bellek.mjs ;;
            bellek-3) BELLEK_ARACLAR=gt3,civic node baseline/bellek.mjs ;;
            *) node baseline/$T.mjs ;;
          esac
      - name: Kırmızı görüntüler günlüğe (indirmeden bakmak için)
        if: failure()
        run: |
          # her dosya: ===GORUNTU <ad>=== satırı + base64 JPEG (yarı boyut). En fazla 30 dosya.
          find tests/out -name '*.png' \( -name '*_yeni.png' -o -name '*fark*.png' -o -path '*menu*' -o -path '*ultra*' \) 2>/dev/null | sort | head -30 | while read -r f; do
            echo "===GORUNTU ${f#tests/out/}==="; if command -v convert >/dev/null; then convert "$f" -resize 50% -quality 80 jpg:- | base64 -w0; else base64 -w0 "$f"; fi; echo; done
      - name: Görüntüler (kırmızıysa)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goruntuler-${{ matrix.test }}
          path: |
            tests/out
            /tmp/karsilastir
          if-no-files-found: ignore
          retention-days: 7
