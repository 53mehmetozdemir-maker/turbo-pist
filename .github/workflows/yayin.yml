# Canlı yayın: main'e her push'ta oyunu derler ve GitHub Pages'e yayınlar.
# Çalışması için repo ayarında Pages → Source = "GitHub Actions" olmalı (geçiş günü bir kez).
# Repoya secret eklenmez; etiket için GitHub'ın her çalışmaya otomatik verdiği geçici GITHUB_TOKEN kullanılır.
# Her başarılı yayın yayin-YYYYMMDD-HHMM etiketi alır → geri dönüş: o etiketi main'e geri almak.
name: yayin

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      acil_sw_kapat:
        description: "ACİL: oyuncuların service worker'ını ve önbelleğini kaldır (sadece bir sürüm oyuncuları takılı bıraktıysa)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12.0'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          VITE_SURUM: ${{ github.sha }}
          # TURN aracısı (worker/README.md). Gizli değil. Boşken oyun sadece STUN kullanır.
          VITE_TURN_URL: ''
          ACIL_SW_KAPAT: ${{ inputs.acil_sw_kapat && '1' || '' }}
      - run: echo "$GITHUB_SHA" > dist/surum.txt
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  etiket:
    needs: deploy
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Yayını etiketle
        run: |
          t="yayin-$(TZ=Europe/Istanbul date +%Y%m%d-%H%M)"
          git tag "$t" "$GITHUB_SHA"
          git push origin "$t"
