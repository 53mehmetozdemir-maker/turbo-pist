<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2230"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#facc15"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#ef4444" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <circle cx="32" cy="38" r="26" fill="url(#glow)"/>
  <!-- tachometer arc from 7 o'clock to 2 o'clock -->
  <path d="M13.6 49.8 A22 22 0 1 1 51.5 26.2" fill="none" stroke="url(#arc)" stroke-width="7" stroke-linecap="round"/>
  <!-- red line segment -->
  <path d="M47.4 19.7 A22 22 0 0 1 51.5 26.2" fill="none" stroke="#ff2d2d" stroke-width="7" stroke-linecap="round"/>
  <!-- needle pinned at the red line -->
  <path d="M32 38 L49 22.5" stroke="#fff" stroke-width="4.2" stroke-linecap="round"/>
  <circle cx="32" cy="38" r="5.2" fill="#fff"/>
  <circle cx="32" cy="38" r="2.2" fill="#ef4444"/>
  <!-- speed streaks -->
  <path d="M38 50 H55 M42 55.5 H56" stroke="#fff" stroke-opacity=".85" stroke-width="3" stroke-linecap="round"/>
</svg>
