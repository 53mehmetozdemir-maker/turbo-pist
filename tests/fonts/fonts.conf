<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Testlerin yazı tipi yapılandırması (Aşama 6, H24). Chrome Linux'ta yedek yazı tiplerini (emoji, sans-serif) ve
     yazı çizim ayarlarını (ipucu, kenar yumuşatma) sistemin fontconfig'inden alır; makineden makineye değişir. Testler
     bunun yerine bu dosyayı kullanır (lib.mjs → FONTCONFIG_FILE): yalnız npm'den sabit sürümle gelen yazı tipleri,
     ipucusuz gri tonlu çizim. Oyunun kendi yazı tipleri (Inter, Bungee) zaten oyunla birlikte gelir. -->
<fontconfig>
  <!-- npm'den sabit sürümle gelen Inter ve Noto Color Emoji, TTF'ye açılmış (hazirla.sh) -->
  <dir prefix="relative">ttf</dir>
  <cachedir>/tmp/tp-test-fontconfig</cachedir>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>
  <alias><family>sans-serif</family><prefer><family>Inter</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Inter</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Inter</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>Inter</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>sans</family><prefer><family>Inter</family><family>Noto Color Emoji</family></prefer></alias>
  <!-- adı ne olursa olsun her istek sonunda Inter'e (ve emojiye) çıkar: Chrome kendi arayüzü için "sans" vb. de sorar -->
  <match target="pattern"><edit name="family" mode="append_last"><string>Inter</string><string>Noto Color Emoji</string></edit></match>
  <alias><family>emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
</fontconfig>
